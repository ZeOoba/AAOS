# AAOS CI. Until 2026-09-10 this repo had no CI at all (open-items-tracker.md#OI-259) -- its
# 226 tests ran only when a human typed the command. AAOS owns the lease/lock discipline that
# stops two agents clobbering each other's task state, and its one documented Critical bug (two
# near-simultaneous appends to aaos-events.ndjson silently clobbering each other, see
# docs/GATE3-REVIEW.md) is regression-guarded by those tests alone.
#
# No secrets, no data access, no self-hosted runner: the suite runs against per-test OS tmpdir
# seam roots (tests/test_queue_scripts.py:28) and never touches the live OneDrive seam.
name: CI

# Windows leg (A0a, docs/superpowers/plans/2026-10-17-aaos-optimization-hardened-plan.md section 11.1):
# production runs on Windows over OneDrive, so the suite must run on Windows too. windows-latest
# proves NTFS/Win32 semantics ONLY -- OneDrive sync, conflict copies and Files-On-Demand stay
# UNVERIFIED until the V1 soak. The Windows legs are continue-on-error and must NOT be made a
# required check until they are green; any baseline test that must be marked expectedFailure on
# Windows needs its own issue and per-test reason (no blanket marking).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows legs are informational until green (see header comment).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.13 is what the operating machine runs. 3.10 is the interpreter inside Cowork's sandbox
        # (measured 3.10.12 by the 2026-10-17 L0 probe); the suite passes on it and it guards the
        # Z-timestamp portability fix. 3.11 additionally guards against depending on a recent
        # stdlib addition a Cowork sandbox might not have -- COWORK-BOOTSTRAP.md's Probe X runs
        # tools/validate.py as a subprocess in whatever Python that sandbox provides.
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py"

  # Contracts check (OI-259). The test matrix above does not run tools/validate.py on the shipped
  # example/template files or tools/check-contract-drift.py, so a schema change that breaks the
  # sample task/handoff, or a publisher regression that writes a mirror the auditor rejects, merged
  # silently; the scheduled fleet task would only notice the next time it ran on the operating machine.
  # This job validates every shipped sample against its schema, then publishes the contracts into a
  # throwaway directory and requires check-contract-drift.py to find it byte-identical to the git tree.
  # It proves the publisher/auditor round trip on this commit, NOT the live seam (which only the
  # operating machine can see). Python 3.10 = the interpreter inside Cowork's sandbox, which is where
  # COWORK-BOOTSTRAP.md runs tools/validate.py. Nothing is written outside runner.temp.
  contracts:
    name: contracts (validate samples, publish round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the agent registry
        run: python tools/validate.py agent-registry.json

      - name: Validate the shipped task example
        run: python tools/validate.py examples/t-sample-001.json

      - name: Validate the shipped handoff example
        run: python tools/validate.py examples/h-sample-001.json

      - name: Validate the task template
        run: python tools/validate.py templates/task.template.json --schema task

      - name: Validate the handoff template
        run: python tools/validate.py templates/handoff.template.json --schema handoff

      - name: Publish contracts to a throwaway seam
        run: python tools/publish-contracts.py --seam-root "${{ runner.temp }}/aaos-seam"

      - name: Contracts mirror matches the git tree
        run: python tools/check-contract-drift.py --seam-root "${{ runner.temp }}/aaos-seam"
