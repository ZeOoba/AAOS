# AAOS CI. Until 2026-09-10 this repo had no CI at all (open-items-tracker.md#OI-259) -- its
# 226 tests ran only when a human typed the command. AAOS owns the lease/lock discipline that
# stops two agents clobbering each other's task state, and its one documented Critical bug (two
# near-simultaneous appends to aaos-events.ndjson silently clobbering each other, see
# docs/GATE3-REVIEW.md) is regression-guarded by those tests alone.
#
# No secrets, no data access, no self-hosted runner: the suite runs against per-test OS tmpdir
# seam roots (tests/test_queue_scripts.py:28) and never touches the live OneDrive seam.
name: CI

# Windows leg (A0a, docs/superpowers/plans/2026-10-17-aaos-optimization-hardened-plan.md section 11.1):
# production runs on Windows over OneDrive, so the suite must run on Windows too. windows-latest
# proves NTFS/Win32 semantics ONLY -- OneDrive sync, conflict copies and Files-On-Demand stay
# UNVERIFIED until the V1 soak. The Windows legs are continue-on-error and must NOT be made a
# required check until they are green; any baseline test that must be marked expectedFailure on
# Windows needs its own issue and per-test reason (no blanket marking).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows legs are informational until green (see header comment).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.13 is what the operating machine runs. 3.10 is the interpreter inside Cowork's sandbox
        # (measured 3.10.12 by the 2026-10-17 L0 probe); the suite passes on it and it guards the
        # Z-timestamp portability fix. 3.11 additionally guards against depending on a recent
        # stdlib addition a Cowork sandbox might not have -- COWORK-BOOTSTRAP.md's Probe X runs
        # tools/validate.py as a subprocess in whatever Python that sandbox provides.
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The 3.13 leg is pinned to an exact patch. Floating '3.13' picked up 3.13.17, whose
          # datetime.fromisoformat no longer accepts an empty fraction before an offset
          # ('23:59:59.+00') or the comma/'+00:60' shapes that tests/fixtures/iso_oracle_py313.json
          # records as accepted: 209 failures in tests/test_iso_py310_normaliser.py. 3.13.14 passes
          # all 374 tests. The matrix value stays '3.13' so the job names (and any required check
          # on them) do not change. Un-pin by regenerating the oracle and re-deriving
          # _normalise_iso_for_py310 against the new stdlib behaviour.
          python-version: ${{ matrix.python-version == '3.13' && '3.13.14' || matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py"
